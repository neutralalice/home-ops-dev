[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[tools]
"1password-cli" = "2.35.0"
uv = "0.13.4"                          # required:template
age = "1.3.2"
cloudflared = "2026.10.3"
flux2 = "2.9.6"
gh = "2.103.0"
gum = "2.0.2"
"github:mitsuhiko/minijinja" = "3.0.1"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
"krew:kopiur" = "latest"
"krew:oidc-login" = "latest"
"krew:resource-capacity" = "latest"
"krew:rook-ceph" = "latest"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
oxfmt = "0.74.0"
sd = "1.1.0"                           # required:template
sops = "3.13.3"
talosctl = "1.14.4"
yq = "4.54.1"
zizmor = "1.31.1"

[hooks]
postinstall = "lefthook install"
