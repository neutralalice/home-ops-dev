[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[tools]
"1password-cli" = "2.35.0"
uv = "0.12.13"                          # required:template
age = "1.3.2"
cloudflared = "2026.9.1"
flux2 = "2.9.5"
gh = "2.100.0"
gum = "2.0.1"
"github:mitsuhiko/minijinja" = "2.24.0"
helm = "4.3.0"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
"krew:oidc-login" = "latest"
"krew:resource-capacity" = "latest"
"krew:rook-ceph" = "latest"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kustomize = "5.8.1"
lefthook = "2.1.12"
oxfmt = "0.67.0"
sd = "1.1.0"                            # required:template
sops = "3.13.3"
talosctl = "1.14.0"
yq = "4.53.6"
zizmor = "1.30.1"

[hooks]
postinstall = "lefthook install"
