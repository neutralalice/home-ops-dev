---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    drivers:
      cephfs:
        enabled: false
        name: rook-ceph.cephfs.csi.ceph.com
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
    operatorConfig:
      driverSpecDefaults:
        log:
          rotation:
            enabled: false
        controllerPlugin:
          containerExtraArgs:
            csi-rbdplugin:
              - --logtostderr=true
        nodePlugin:
          log:
            rotation:
              enabled: false
          containerExtraArgs:
            csi-rbdplugin:
              - --logtostderr=true
