---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rfc2136-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    template:
      data:
        BIND_HOST: "{{ .HOST }}"
        BIND_ZONE: "{{ .ZONE }}"
        BIND_PORT: "{{ .PORT }}"
        BIND_TSIG_KEYNAME: "{{ .TSIG_KEYNAME }}"
        BIND_TSIG_SECRET: "{{ .TSIG_SECRET }}"
  dataFrom:
    - extract:
        key: rfc2136
