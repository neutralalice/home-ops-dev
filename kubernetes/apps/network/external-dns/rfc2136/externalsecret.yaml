---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rfc2136-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    template:
      data:
        HOST: "{{ .HOST }}"
        ZONE: "{{ .ZONE }}"
        PORT: "{{ .PORT }}"
        TSIG_KEYNAME: "{{ .TSIG_KEYNAME }}"
        TSIG_SECRET: "{{ .TSIG_SECRET }}"
  dataFrom:
    - extract:
        key: rfc2136
