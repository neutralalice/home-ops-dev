---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources Service HTTPRoute TCPRoute TLSRoute UDPRoute
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
    service:
      type: LoadBalancer
      ipFamilyPolicy: RequireDualStack
      ipFamilies:
        - IPv6
        - IPv4
      port: 53
      annotations:
        lbipam.cilium.io/ips: "fdca:fec0:ffee:88::68,172.16.88.68"
      externalTrafficPolicy: Cluster
