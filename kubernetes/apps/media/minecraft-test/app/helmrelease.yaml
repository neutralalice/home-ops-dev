---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-test
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.9.2@sha256:244e72a36a3e3d69c588cbeefe6d8f6f97c48869b801718a4023570654e3b3d9
            env:
              EULA: "true"
              GAMEMODE: survival
              SERVER_NAME: "valse"
              LEVEL_NAME: "valse"
              DIFFICULTY: normal
              ENABLE_SSH: "false"
              ALLOW_CHEATS: "false"
              ONLINE_MODE: "true"
              ALLOW_LIST: "true"
              ALLOW_LIST_USERS: "Kalax48,arita1052"
              OPS: "2535470052457386"
              OP_PERMISSION_LEVEL: "4"
              VIEW_DISTANCE: "20"
              TICK_DISTANCE: "12"
              CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
              VERSION: "1.26.52.3"
              SERVER_PORT: &port "19135"
              SERVER_UDP_PORTS: "19135-19138"
              ENABLE_LAN_VISIBILITY: "true"
              TRANSPORT: "nethernet"
            ports:
              - name: tcp-19135
                containerPort: 19135
                protocol: TCP
              - name: udp-7551
                containerPort: 7551
                protocol: UDP
              - name: udp-19135
                containerPort: 19135
                protocol: UDP
              - name: udp-19136
                containerPort: 19136
                protocol: UDP
              - name: udp-19137
                containerPort: 19137
                protocol: UDP
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                cpu: 2000m
                memory: 1024Mi
              requests:
                cpu: 500m
                memory: 1024Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      hostNetwork: false
      shareProcessNamespace: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: *app
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv6
        type: ClusterIP
        ports:
          tcp-19135:
            port: 19135
            protocol: TCP
            targetPort: 19135
          udp-7551:
            port: 7551
            protocol: UDP
            targetPort: 7551
          udp-19135:
            port: 19135
            protocol: UDP
            targetPort: 19135
          udp-19136:
            port: 19136
            protocol: UDP
            targetPort: 19136
          udp-19137:
            port: 19137
            protocol: UDP
            targetPort: 19137
