---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
            env:
              QBT_TORRENTING_PORT: &torrentPort 31288
              QBT_WEBUI_PORT: &port 80
              TZ: Europe/London
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              limits:
                memory: 2Gi
                cpu: 2000m
              requests:
                cpu: 400m
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 300
    persistence:
      config:
        existingClaim: qbt-restored
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
      media:
        enabled: true
        type: nfs
        server: 172.16.69.17
        path: /volume1/torrent
        globalMounts:
          - path: /media
      tmpfs:
        type: emptyDir
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      bittorrent:
        kind: TCPRoute
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: bittorrent-tcp
        rules:
          - backendRefs:
              - name: *app
                port: *torrentPort
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ipFamilyPolicy: SingleStack
        ports:
          http:
            port: *port
          bittorrent-client:
            port: *torrentPort
            protocol: TCP
