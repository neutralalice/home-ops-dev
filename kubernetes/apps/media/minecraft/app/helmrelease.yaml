---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.9.1@sha256:83bdd41fd0574eb71368a58b2c0b9ecfe305559056d65e83878c20aae86a0015
            env:
              EULA: "true"
              GAMEMODE: survival
              DIFFICULTY: normal
              ENABLE_SSH: "false"
              ALLOW_CHEATS: "false"
              ONLINE_MODE: "true"
              ALLOW_LIST: "true"
              ALLOW_LIST_USERS: "Kalax48,arita1052"
              VIEW_DISTANCE: "16"
              CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
              VERSION: "1.26.52.3"
              SERVER_PORT: &port "19132"
              #              ENABLE_BDS_V6BIND_FIX: "true"
              #              SERVER_PORT_V6: *port
              #SERVER_UDP_PORTS: "19133-19134"
              ENABLE_LAN_VISIBILITY: "false"
              TRANSPORT: "raknet" #nethernet broken
            ports:
              - name: tcp-19132
                containerPort: 19132
                protocol: TCP
              - name: udp-19132
                containerPort: 19132
                protocol: UDP
              - name: udp-19133
                containerPort: 19133
                protocol: UDP
              - name: udp-19134
                containerPort: 19134
                protocol: UDP
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                cpu: 8000m
                memory: 3072Mi
              requests:
                cpu: 500m
                memory: 3072Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    #    networkPolicies:
    #      ipv4Deny:
    #        enabled: true
    #        type: cilium
    #        controller: *app
    #        egressDeny:
    #          - toCIDR:
    #              - "0.0.0.0/0"
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      udp-19132:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19132
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
      udp-19133:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19133
        rules:
          - backendRefs:
              - name: minecraft
                port: 19133
      udp-19134:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19134
        rules:
          - backendRefs:
              - name: minecraft
                port: 19134
      tcp:
        kind: TCPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-tcp
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
    service:
      app:
        controller: *app
        ipFamilyPolicy: SingleStack
        ipFamilies:
          #  - IPv6
          - IPv4
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "172.16.88.99" #"fdca:fec0:ffee:88::99"
        ports:
          tcp-19132:
            port: 19132
            protocol: TCP
            targetPort: 19132
          udp-19132:
            port: 19132
            protocol: UDP
            targetPort: 19132
          udp-19133:
            port: 19133
            protocol: UDP
            targetPort: 19133
          udp-19134:
            port: 19134
            protocol: UDP
            targetPort: 19134
