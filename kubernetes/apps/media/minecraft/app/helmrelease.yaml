---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.9.2@sha256:244e72a36a3e3d69c588cbeefe6d8f6f97c48869b801718a4023570654e3b3d9
            env:
              EULA: "true"
              GAMEMODE: survival
              SERVER_NAME: "vystrana"
              LEVEL_NAME: "vystrana"
              DIFFICULTY: normal
              ENABLE_SSH: "false"
              ALLOW_CHEATS: "false"
              ONLINE_MODE: "true"
              ALLOW_LIST: "true"
              ALLOW_LIST_USERS: "Kalax48,arita1052"
              OPS: "arita1052"
              VIEW_DISTANCE: "20"
              CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
              VERSION: "1.26.52.3"
              SERVER_PORT: &port "19132"
              SERVER_UDP_PORTS: "19132-19134"
              ENABLE_LAN_VISIBILITY: "true"
              TRANSPORT: "nethernet"
            ports:
              - name: tcp-19132
                containerPort: 19132
                protocol: TCP
              - name: udp-7551
                containerPort: 7551
                protocol: UDP
              - name: udp-19132
                containerPort: 19132
                protocol: UDP
              - name: udp-19133
                containerPort: 19133
                protocol: UDP
              - name: udp-19134
                containerPort: 19134
                protocol: UDP
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                cpu: 8000m
                memory: 3072Mi
              requests:
                cpu: 500m
                memory: 3072Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: true
      hostNetwork: true
      shareProcessNamespace: false
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      udp-7551:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-7551
        rules:
          - backendRefs:
              - name: minecraft
                port: 7551
      udp-19132:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19132
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
      udp-19133:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19133
        rules:
          - backendRefs:
              - name: minecraft
                port: 19133
      udp-19134:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp-19134
        rules:
          - backendRefs:
              - name: minecraft
                port: 19134
      tcp:
        kind: TCPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-tcp
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
    service:
      app:
        controller: *app
        ipFamilyPolicy: RequireDualStack
        ipFamilies:
          - IPv6
          - IPv4
        type: ClusterIP
        ports:
          tcp-19132:
            port: 19132
            protocol: TCP
            targetPort: 19132
          udp-7551:
            port: 7551
            protocol: UDP
            targetPort: 7551
          udp-19132:
            port: 19132
            protocol: UDP
            targetPort: 19132
          udp-19133:
            port: 19133
            protocol: UDP
            targetPort: 19133
          udp-19134:
            port: 19134
            protocol: UDP
            targetPort: 19134
