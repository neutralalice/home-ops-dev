---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.9.0@sha256:10cb4e735211356544980313773a6723d14747e675d8e23d2c25df1d69505743
            env:
              EULA: "true"
              GAMEMODE: survival
              DIFFICULTY: normal
              ENABLE_SSH: "false"
              ALLOW_CHEATS: "false"
              ONLINE_MODE: "true"
              ALLOW_LIST: "true"
              ALLOW_LIST_USERS: "Kalax48,arita1052"
              VIEW_DISTANCE: "16"
              CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
              VERSION: "1.26.51.1"
              #              ENABLE_BDS_V6BIND_FIX: "true"
              SERVER_PORT_V6: &port "19132"
              #              SERVER_PORT: *port
              ENABLE_LAN_VISIBILITY: "true"
              TRANSPORT: "nethernet"
            ports:
              - name: bedrock-tcp
                containerPort: 19132
                protocol: TCP
              - name: bedrock-udp
                containerPort: 19132
                protocol: UDP
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: false
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                cpu: 8000m
                memory: 3072Mi
              requests:
                cpu: 500m
                memory: 3072Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      udp:
        kind: UDPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
      tcp:
        kind: TCPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-tcp
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
    service:
      app:
        controller: *app
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv6
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "fdca:fec0:ffee:88::99"
        ports:
          minecraft:
            port: 19132
            protocol: UDP
            targetPort: 19132
          minecraft-tcp:
            port: 19132
            protocol: TCP
            targetPort: 19132
