---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.8.2@sha256:6bb1cb8ee0c1fdf96dbd9dfe77bed4e20c8e3946112bed4f9be609e8f14efe9a
            env:
              EULA: "true"
              GAMEMODE: survival
              DIFFICULTY: normal
              ENABLE_SSH: "false"
              ONLINE_MODE: "false"
              VERSION: "1.26.45.1"
              SERVER_PORT: &port "19132"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                cpu: 8000m
                memory: 3072Mi
              requests:
                cpu: 500m
                memory: 3072Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        kind: UDPRoute
        annotations:
          external-dns.kubernetes.io/hostname: "bedrock.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: bedrock-udp
        rules:
          - backendRefs:
              - name: minecraft
                port: 19132
      ssh:
        kind: TCPRoute
        annotations:
          external-dns.kubernetes.io/hostname: "bedrock.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: ssh-tcp
        rules:
          - backendRefs:
              - name: minecraft
                port: 2222
    service:
      app:
        controller: *app
        ports:
          ssh:
            port: 2222
            protocol: TCP
          minecraft:
            port: 19132
            protocol: UDP
