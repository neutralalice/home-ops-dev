---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: blackbox-exporter-dns-internal
spec:
  jobName: blackbox-dns-internal
  scrapeInterval: 135s
  scrapeTimeout: 5s
  staticConfigs:
    - targets:
        - fdca:fec0:ffee:69::1
      labels:
        prober: dns
        module: dns_a
    - targets:
        - fdca:fec0:ffee:69::1
      labels:
        prober: dns
        module: dns_aaaa
    - targets:
        - fdca:fec0:ffee:69::1
      labels:
        prober: dns
        module: dns_caa
    - targets:
        - fdca:fec0:ffee:69::1
      labels:
        prober: dns
        module: dns_soa
    - targets:
        - fdca:fec0:ffee:69::1
      labels:
        prober: dns
        module: dns_txt
  metricsPath: /probe
  relabelings:
    - sourceLabels: [__address__]
      action: replace
      targetLabel: instance
    - sourceLabels: [__address__]
      action: replace
      targetLabel: __param_target
    - targetLabel: __address__
      action: replace
      replacement: blackbox-exporter.observability.svc.cluster.local:9115
    - sourceLabels: [module]
      action: replace
      targetLabel: __param_module
---
