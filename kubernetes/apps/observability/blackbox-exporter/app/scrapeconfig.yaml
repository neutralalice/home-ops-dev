apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: blackbox-exporter-http
spec:
  jobName: blackbox-http
  scrapeInterval: 15s
  scrapeTimeout: 5s
  staticConfigs:
    - targets:
        - https://[${BLACKBOX_IP6_EXTERNAL_ADDRESS}]:8443
      labels:
        prober: http
        module: quic6
    - targets:
        - https://[${BLACKBOX_IP6_EXTERNAL_ADDRESS}]:8443
        - https://${BLACKBOX_IP6_EXTERNAL_DOMAIN}
      labels:
        prober: http
        module: http6
  metricsPath: /probe
  relabelings:
    - sourceLabels: [__address__]
      action: replace
      targetLabel: instance
    - sourceLabels: [__address__]
      action: replace
      targetLabel: __param_target
    - targetLabel: __address__
      action: replace
      replacement: blackbox-exporter.observability.svc.cluster.local:9115
    - sourceLabels: [module]
      action: replace
      targetLabel: __param_module
---
