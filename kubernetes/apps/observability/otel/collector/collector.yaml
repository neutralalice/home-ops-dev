---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-daemonset
spec:
  mode: daemonset
  serviceAccount: collector
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
  # this enables the servicemonitor for the daemonset
  observability:
    metrics:
      enableMetrics: true
  resources:
    limits:
      memory: 512Mi
      cpu: 1000m
    requests:
      cpu: 25m
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "host.name=$(K8S_NODE_NAME)"
  volumes:
    - name: proc
      hostPath:
        path: /proc
    - name: root
      hostPath:
        path: /
    - name: sys
      hostPath:
        path: /sys
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: root
      mountPath: /host/root
      readOnly: true
    - name: sys
      mountPath: /host/sys
      readOnly: true
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  config:
    receivers:
      file_log/pods:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/otc-container/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          - type: json_parser
            on_error: send_quiet
      host_metrics:
        collection_interval: 10s
        root_path: /host
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          #          filesystem: {}
          load: {}
          network: {}
      syslog:
        udp:
          listen_address: "[::]:514"
        protocol: rfc5424
      tcp_log:
        listen_address: "[::]:5140"
      otlp:
        protocols:
          grpc:
            endpoint: "[::]:4317"
          http:
            endpoint: "[::]:4318"
    processors:
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tags
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 70
        spike_limit_percentage: 25
      resource_detection/env:
        detectors: [env]
        timeout: 2s
      transform/hostmetrics:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["instance"], resource.attributes["host.name"])
      transform/talos:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - IsString(log.body) and IsMatch(log.body, "^\\{")
            statements:
              - merge_maps(log.cache, ParseJSON(log.body), "upsert")
              - set(resource.attributes["talos.service"], log.cache["talos-service"])
              - set(log.attributes["level"], log.cache["talos-level"])
              - set(log.body, log.cache["msg"])
              - set(log.time_unix_nano, UnixNano(Time(log.cache["talos-time"], "%Y-%m-%dT%H:%M:%S.%fZ")))
      batch: {}
    exporters:
      #     debug:
      #       verbosity: detailed
      otlp_http/vlogs:
        compression: zstd
        logs_endpoint: http://victoria-logs-server.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        tls:
          insecure: true
      otlp_http/prom:
        compression: gzip
        metrics_endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics
        tls:
          insecure: true
    service:
      # this is ignored in the current otel operator version and overwritten
      # when it's fixed, I can switch to periodic
      #            - periodic:
      #                interval: 10s
      #                exporter:
      #                  otlp_http:
      #                    endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      pipelines:
        logs/syslog:
          receivers:
            - syslog
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_http/vlogs
        logs/k8s:
          receivers:
            - file_log/pods
          processors:
            - memory_limiter
            - k8s_attributes
            - batch
          exporters:
            - otlp_http/vlogs
        logs/talos_machine:
          receivers:
            - tcp_log
          processors:
            - memory_limiter
            - transform/talos
            - batch
          exporters:
            - otlp_http/vlogs
        metrics/host:
          receivers:
            - host_metrics
          processors:
            - memory_limiter
            - resource_detection/env
            - transform/hostmetrics
            - batch
          exporters:
            - otlp_http/prom
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_http/prom
