---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: talos-tcp
  namespace: observability
  annotations:
    external-dns.kubernetes.io/hostname: otel-collector.${SECRET_DOMAIN}
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: talos-tcp
  rules:
    - backendRefs:
        - name: otel-collector-collector
          port: 5140
