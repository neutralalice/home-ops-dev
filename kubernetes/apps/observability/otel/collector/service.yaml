---
apiVersion: v1
kind: Service
metadata:
  name: otel-syslog-collector
spec:
  type: ClusterIP
  ports:
    - port: 514
      targetPort: 514
      protocol: TCP
      name: syslog
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: observability.otel-daemonset
    app.kubernetes.io/name: otel-daemonset-collector
