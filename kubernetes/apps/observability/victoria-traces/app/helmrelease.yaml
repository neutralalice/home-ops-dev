---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces
  namespace: observability
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-traces
  interval: 1h
  values:
    server:
      fullnameOverride: victoria-traces
      extraArgs:
        enableTCP6: "true"
        maxConcurrentInserts: 6
      http:
        - name: http
          primary: true
          value: "[::]:10428"
      retentionPeriod: 14d
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      resources:
        limits:
          cpu: 2000m
          memory: 768Mi
        requests:
          cpu: 80m
          memory: 768Mi
      route:
        enabled: true
        hostnames:
          - victoria-traces.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      serviceMonitor:
        enabled: true
