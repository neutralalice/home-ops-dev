---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: idm.${SECRET_DOMAIN}
  ldapPortName: ldaps
  tlsSecretName: idm-${SECRET_DOMAIN/./-}-tls
  image: kanidm/server:1.11.1
  oauth2ClientNamespaceSelector:
    matchLabels: {}
  groupNamespaceSelector:
    matchLabels: {}
  personNamespaceSelector:
    matchLabels: {}
  serviceAccountNamespaceSelector:
    matchLabels: {}
  disableUpgradeChecks: true
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      statefulSetAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        limits:
          cpu: 1000m
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 200Mi
  hostUsers: false
  securityContext:
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kanidm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 150Mi
  gateway:
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - idm.${SECRET_DOMAIN}
    backendTlsPolicy:
      validation:
        hostname: idm.${SECRET_DOMAIN}
        wellKnownCaCertificates: System
